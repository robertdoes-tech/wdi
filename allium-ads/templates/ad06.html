<style>
/* Ad 6: clean label. Badge list left, both bottles with a small pour of capsules in front. */
.safe { display: flex; flex-direction: column; }
.h1 { margin-top: 44px; max-width: var(--hw); }
.badges { list-style: none; width: var(--col); margin-top: var(--list-top); display: flex; flex-direction: column; }
.badges li { display: flex; gap: 16px; align-items: flex-start; padding: var(--li-pad) 0; border-bottom: 1.5px solid var(--panel-line); font-size: var(--body); line-height: 1.3; color: var(--ink); }
.badges li:first-child { border-top: 1.5px solid var(--panel-line); }
.badges svg { flex: none; width: 26px; height: 26px; margin-top: 3px; }
.end { margin-top: auto; width: var(--end-w); }
.b-main { height: var(--bh); right: var(--br); bottom: var(--bb); }
.caps { position: absolute; z-index: 4; width: var(--cw); right: var(--cr); bottom: var(--cb); }
.caps svg { width: 100%; display: block; }

body[data-size="1350"] { --hw: 780px; --col: 470px; --list-top: 52px; --li-pad: 18px; --end-w: 470px; --bh: 560px; --br: 44px; --bb: 170px; --cw: 360px; --cr: 120px; --cb: 104px; }
body[data-size="1080"] { --hw: 900px; --col: 470px; --list-top: 30px; --li-pad: 12px; --end-w: 470px; --bh: 470px; --br: 50px; --bb: 110px; --cw: 300px; --cr: 110px; --cb: 56px; }
body[data-size="1080"] .h1 { margin-top: 30px; }
body[data-size="1920"] { --hw: 820px; --col: 560px; --list-top: 60px; --li-pad: 20px; --end-w: 420px; --bh: 640px; --br: 40px; --bb: 140px; --cw: 400px; --cr: 140px; --cb: 70px; }
</style>
<div class="safe">
  <div class="mark">{{g.wordmark}}</div>
  <h1 class="h1">{{copy.headline}}</h1>
  <ul class="badges">
    {{#each copy.badges}}
    <li><svg viewBox="0 0 26 26" aria-hidden="true"><circle cx="13" cy="13" r="11.5" fill="none" stroke="var(--accent)" stroke-width="1.5"/><path d="M7.5 13.4l3.6 3.6 7.4-7.6" fill="none" stroke="var(--accent)" stroke-width="1.8"/></svg><span>{{.}}</span></li>
    {{/each}}
  </ul>
  <div class="end"><p class="legal">{{g.legal}}</p></div>
</div>
{{bottle bottle main}}
<div class="caps" data-visual>
  <svg viewBox="0 0 360 110" aria-hidden="true">
    <defs>
      <g id="cap">
        <rect x="-38" y="-13" width="76" height="26" rx="13" fill="#efe6d4"/>
        <rect x="-38" y="-13" width="38" height="26" rx="13" fill="#e6dac3"/>
        <rect x="-8" y="-13" width="8" height="26" fill="#e6dac3"/>
        <rect x="-30" y="-8" width="40" height="5" rx="2.5" fill="#fff" opacity=".55"/>
        <rect x="-38" y="-13" width="76" height="26" rx="13" fill="none" stroke="#000" stroke-opacity=".12"/>
      </g>
    </defs>
    <ellipse cx="190" cy="98" rx="170" ry="9" fill="#000" opacity=".12"/>
    <use href="#cap" transform="translate(70 84) rotate(-14)"/>
    <use href="#cap" transform="translate(150 90) rotate(8)"/>
    <use href="#cap" transform="translate(112 62) rotate(-32)"/>
    <use href="#cap" transform="translate(230 88) rotate(-4)"/>
    <use href="#cap" transform="translate(196 66) rotate(22)"/>
    <use href="#cap" transform="translate(300 90) rotate(12)"/>
  </svg>
</div>
