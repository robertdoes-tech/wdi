<style>
/* Ad 8: review. The quote is the headline, set large in EB Garamond; small bottles below. */
.safe { display: flex; flex-direction: column; }
.qmark { width: calc(var(--qm) * .5); margin-top: var(--qm-top); color: var(--accent); }
.qmark svg { display: block; width: 100%; }
.quote { font-family: var(--serif); font-style: italic; font-size: var(--q); line-height: 1.04; letter-spacing: -.012em; color: var(--head); max-width: var(--qw); margin-top: 24px; text-wrap: balance; }
.attr { margin-top: 40px; display: flex; flex-direction: column; gap: 6px; }
.attr .who { font-size: var(--body); font-weight: 500; color: var(--ink); }
.attr .src { font-size: var(--small); color: var(--ink-2); }
.tpwrap { margin-top: 28px; }
.end { margin-top: auto; width: var(--end-w); }
.b-main { height: var(--bh); right: var(--br); bottom: var(--bb); }

body[data-size="1350"] { --qm: 220px; --qm-top: 70px; --q: 100px; --qw: 920px; --end-w: 440px; --bh: 440px; --br: 70px; --bb: 90px; }
body[data-size="1080"] { --qm: 170px; --qm-top: 44px; --q: 74px; --qw: 940px; --end-w: 480px; --bh: 340px; --br: 64px; --bb: 60px; }
body[data-size="1080"] .attr { margin-top: 26px; }
body[data-size="1080"] .tpwrap { margin-top: 18px; }
body[data-size="1920"] { --qm: 240px; --qm-top: 60px; --q: 100px; --qw: 920px; --end-w: 420px; --bh: 560px; --br: 64px; --bb: 150px; }
</style>
<div class="safe">
  <div class="mark">{{g.wordmark}}</div>
  <div class="qmark" aria-hidden="true"><svg viewBox="0 0 110 80"><path fill="currentColor" d="M44 4C20 14 6 32 6 54c0 14 8 22 19 22 10 0 18-8 18-18s-7-17-16-17c-2 0-4 0-5 1 3-12 12-22 26-30zm58 0C78 14 64 32 64 54c0 14 8 22 19 22 10 0 18-8 18-18s-7-17-16-17c-2 0-4 0-5 1 3-12 12-22 26-30z"/></svg></div>
  <blockquote class="quote">{{copy.quote}}</blockquote>
  <div class="attr">
    <span class="who">{{copy.author}}</span>
    <span class="src">{{copy.platform}}, {{copy.about}}</span>
  </div>
  <div class="tpwrap">{{trustpilot}}</div>
  <div class="end"><p class="legal">{{g.legal}}</p></div>
</div>
{{bottle bottle main}}
