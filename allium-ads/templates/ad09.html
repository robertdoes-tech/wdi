<style>
/* Ad 9: offer and risk-free. Three ticked points, a review proof strip, bottle right. */
.safe { display: flex; flex-direction: column; }
.h1 { margin-top: 52px; max-width: var(--hw); font-size: var(--big); line-height: 1; }
.points { list-style: none; width: var(--col); margin-top: var(--pts-top); display: flex; flex-direction: column; gap: var(--pts-gap); }
.points li { display: flex; gap: 16px; align-items: flex-start; font-size: var(--lead-s); line-height: 1.3; color: var(--ink); }
.points svg { flex: none; width: 28px; height: 28px; margin-top: 4px; }
.strip { width: var(--col); margin-top: var(--strip-top); padding: 24px 28px; }
.strip .q { font-family: var(--serif); font-style: italic; font-size: var(--lead); line-height: 1.15; color: var(--ink); }
.strip .who { margin-top: 10px; font-size: var(--small); color: var(--ink-2); }
.end { margin-top: auto; width: var(--end-w); }
.b-main { height: var(--bh); right: var(--br); bottom: var(--bb); }

body[data-size="1350"] { --hw: 600px; --big: 112px; --col: 540px; --pts-top: 52px; --pts-gap: 22px; --lead-s: 28px; --strip-top: 44px; --end-w: 520px; --bh: 760px; --br: 60px; --bb: 110px; }
body[data-size="1080"] { --hw: 600px; --big: 88px; --col: 560px; --pts-top: 32px; --pts-gap: 14px; --lead-s: 25px; --strip-top: 28px; --end-w: 540px; --bh: 600px; --br: 60px; --bb: 70px; }
body[data-size="1080"] .h1 { margin-top: 34px; }
body[data-size="1080"] .strip { padding: 18px 22px; }
body[data-size="1920"] { --hw: 600px; --big: 124px; --col: 540px; --pts-top: 60px; --pts-gap: 26px; --lead-s: 30px; --strip-top: 48px; --end-w: 480px; --bh: 900px; --br: 40px; --bb: 120px; }
</style>
<div class="safe">
  <div class="mark">{{g.wordmark}}</div>
  <h1 class="h1">{{copy.headline}}</h1>
  <ul class="points">
    {{#each copy.points}}
    <li><svg viewBox="0 0 28 28" aria-hidden="true"><circle cx="14" cy="14" r="12.5" fill="none" stroke="var(--accent)" stroke-width="1.6"/><path d="M8 14.4l4 4 8-8.2" fill="none" stroke="var(--accent)" stroke-width="2"/></svg><span>{{.}}</span></li>
    {{/each}}
  </ul>
  <div class="strip glass">
    <p class="q">“{{copy.quote}}”</p>
    <p class="who">{{copy.author}}, {{copy.platform}}</p>
  </div>
  <div class="end"><p class="legal">{{g.legal}}</p></div>
</div>
{{bottle bottle main}}
