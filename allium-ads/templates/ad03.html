<style>
/* Ad 3: Motus stat hook. Bottle alone on a plain stone platform, lots of air. */
.safe { display: flex; flex-direction: column; }
.h1 { margin-top: 44px; max-width: var(--hw); }
.col { width: var(--col); display: flex; flex-direction: column; flex: 1; padding-top: 44px; }
.col .rule { margin-bottom: 28px; }
.col .lead { font-size: var(--stat); line-height: 1.1; margin-bottom: 22px; }
.col .source { margin-top: 18px; }
.col .end { margin-top: auto; display: flex; flex-direction: column; gap: 16px; }
.stage { position: absolute; z-index: 2; right: var(--sr); bottom: var(--sb); width: var(--pw); display: flex; flex-direction: column; align-items: center; }
.stage .bottle { position: relative; height: var(--bh); z-index: 3; }
.stage .plinth { position: relative; width: 100%; height: var(--ph); margin-top: -34px; }

body[data-size="1350"] { --hw: 820px; --col: 500px; --stat: 44px; --sr: 60px; --sb: 140px; --pw: 420px; --ph: 190px; --bh: 600px; }
body[data-size="1080"] { --hw: 900px; --col: 520px; --stat: 36px; --sr: 64px; --sb: 90px; --pw: 360px; --ph: 140px; --bh: 500px; }
body[data-size="1080"] .h1 { margin-top: 30px; }
body[data-size="1080"] .col { padding-top: 30px; }
body[data-size="1080"] .col .end { gap: 12px; }
body[data-size="1920"] { --hw: 860px; --col: 520px; --stat: 46px; --sr: 60px; --sb: 150px; --pw: 440px; --ph: 260px; --bh: 700px; }
</style>
<div class="safe">
  <div class="mark">{{g.wordmark}}</div>
  <h1 class="h1">{{copy.headline}}</h1>
  <div class="col">
    <div class="rule"></div>
    <p class="lead">{{copy.stat}}</p>
    <p class="body">{{copy.sub}}</p>
    <p class="source">{{g.sourcePrefix}}{{copy.source}}</p>
    <div class="end">
      <p class="foot">{{copy.footer}}</p>
      <p class="legal">{{g.legal}}</p>
    </div>
  </div>
</div>
<div class="stage">
  {{bottle bottle main}}
  <div class="plinth" data-visual><div class="top"></div><div class="face"></div></div>
</div>
