<!doctype html><html><head><meta charset="utf-8">
<style>
@font-face{font-family:Inter;font-weight:500;src:url(../showreel/public/fonts/inter-latin-500-normal.woff2)}
@font-face{font-family:Inter;font-weight:600;src:url(../showreel/public/fonts/inter-latin-600-normal.woff2)}
html,body{margin:0;width:1920px;height:1080px;overflow:hidden}
#c{position:relative;width:1920px;height:1080px;overflow:hidden;font-family:Inter}
.light{background:radial-gradient(ellipse 70% 80% at 50% 55%,#ffffff 0%,#f6f8fc 55%,#e9eef8 100%)}
.dark{background:radial-gradient(ellipse 75% 85% at 45% 55%,#123a78 0%,#0b2350 55%,#06142f 100%)}
svg#lines{position:absolute;inset:0}
.orb{position:absolute;border-radius:50%}
.logo{position:absolute;top:64px;right:84px;width:330px}
.tag{position:absolute;right:86px;top:206px;font-weight:600;font-size:21px;letter-spacing:.14em;text-transform:uppercase}
.light .tag{color:#0b2a5b}.dark .tag{color:#cfe0ff}
.rule{position:absolute;right:86px;top:196px;width:330px;height:3px;border-radius:2px;background:linear-gradient(90deg,#0a8fe8,#4c46d8)}
.dots{position:absolute;left:84px;bottom:72px;display:flex;gap:14px}
.dots i{width:22px;height:22px;border-radius:50%;display:block}
.bar{position:absolute;left:0;right:0;bottom:0;height:10px;background:linear-gradient(90deg,#0a8fe8,#1f63e0 50%,#4c46d8)}
.url{position:absolute;right:86px;bottom:64px;font-weight:500;font-size:22px;letter-spacing:.06em}
.light .url{color:#4a5b78}.dark .url{color:#9fb6dc}
</style></head><body><div id="c">
<svg id="lines" width="1920" height="1080"></svg>
<div class="orb" id="o1"></div><div class="orb" id="o2"></div>
<div class="rule"></div>
<img class="logo" id="logo">
<div class="tag" style="top:214px">External Outbound Sales Agent</div>
<div class="dots"><i style="background:#0a4fe0"></i><i style="background:#3f73ea"></i><i style="background:#86a6f2"></i></div>
<div class="bar"></div>
</div>
<script>
const dark=location.hash==='#dark';
const c=document.getElementById('c');c.className=dark?'dark':'light';
document.getElementById('logo').src=dark?'assets/logo_white.png':'assets/logo.png';
const o1=document.getElementById('o1'),o2=document.getElementById('o2');
Object.assign(o1.style,{width:'420px',height:'420px',left:'-170px',top:'-190px',
 background:dark?'radial-gradient(circle at 70% 75%,rgba(40,120,255,.55),rgba(40,120,255,0) 70%)':'radial-gradient(circle at 70% 75%,#1f5fe6 0%,rgba(80,130,240,.35) 45%,rgba(255,255,255,0) 72%)',opacity:dark?1:.75});
Object.assign(o2.style,{width:'300px',height:'300px',right:'-110px',bottom:'-120px',
 background:dark?'radial-gradient(circle at 30% 30%,rgba(90,110,255,.5),rgba(90,110,255,0) 70%)':'radial-gradient(circle at 30% 30%,#2a63e6 0%,rgba(80,120,240,.3) 45%,rgba(255,255,255,0) 72%)',opacity:dark?1:.6});
// circuit traces, seeded
let s=7;const r=()=>(s=(s*16807)%2147483647)/2147483647;
const svg=document.getElementById('lines'),NS='http://www.w3.org/2000/svg';
const col=dark?'rgba(150,190,255,':'rgba(30,70,140,';
function trace(x,y,dir){let d=`M${x} ${y}`;let n=3+Math.floor(r()*3);
 for(let k=0;k<n;k++){const L=60+r()*180;
  if(k%2==0){x+=dir*L}else{const dy=(r()<.5?-1:1)*(30+r()*70);x+=dir*Math.abs(dy);y+=dy}
  d+=` L${x.toFixed(0)} ${y.toFixed(0)}`}
 const fade=Math.min(1,Math.abs(x-960)/700);
 const p=document.createElementNS(NS,'path');p.setAttribute('d',d);p.setAttribute('fill','none');
 p.setAttribute('stroke',col+(dark?.16:.10)+')');p.setAttribute('stroke-width',2);svg.appendChild(p);
 const e=document.createElementNS(NS,'circle');e.setAttribute('cx',x);e.setAttribute('cy',y);e.setAttribute('r',4.5);
 e.setAttribute('fill','none');e.setAttribute('stroke',col+(dark?.22:.14)+')');e.setAttribute('stroke-width',2);svg.appendChild(e);}
for(let i=0;i<16;i++){trace(-20,120+i*58+r()*20,1)}
for(let i=0;i<10;i++){trace(1940,420+i*62+r()*20,-1)}
</script></body></html>
